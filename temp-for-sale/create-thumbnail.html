<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Alarm Clock - Thumbnail</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        .thumbnail {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }
        
        .clock-icon {
            font-size: 24px;
            color: #fff;
            margin-bottom: 2px;
        }
        
        .app-name {
            font-size: 8px;
            color: #fff;
            font-weight: bold;
            text-align: center;
            line-height: 1;
        }
        
        .glow {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="thumbnail">
        <div class="glow"></div>
        <div class="clock-icon">⏰</div>
        <div class="app-name">ALARM</div>
    </div>
    
    <script>
        // Instructions for creating thumbnail:
        // 1. Open this file in browser
        // 2. Take screenshot of the thumbnail (80x80 area)
        // 3. Save as PNG or JPEG
        console.log('Thumbnail ready for screenshot - 80x80 pixels');
    </script>
</body>
</html>
