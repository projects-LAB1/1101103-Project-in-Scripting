<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Alarm Clock App - Preview</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .preview-container {
            width: 590px;
            height: 300px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 20px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }
        
        .left-section {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
        }
        
        .app-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .app-subtitle {
            font-size: 14px;
            margin-bottom: 20px;
            color: #e0e6ff;
        }
        
        .features {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .features li {
            font-size: 12px;
            margin-bottom: 8px;
            color: #fff;
            position: relative;
            padding-left: 20px;
        }
        
        .features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4ade80;
            font-weight: bold;
        }
        
        .right-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.1);
            position: relative;
        }
        
        .phone-mockup {
            width: 120px;
            height: 240px;
            background: #000;
            border-radius: 25px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
        }
        
        .time-display {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4ade80;
        }
        
        .alarm-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .status-text {
            font-size: 10px;
            color: #888;
        }
        
        .glow-effect {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="glow-effect"></div>
        <div class="left-section">
            <h1 class="app-title">Smart Alarm Clock</h1>
            <p class="app-subtitle">React Native Source Code</p>
            <ul class="features">
                <li>Multiple alarm management</li>
                <li>Mini-games for dismissal</li>
                <li>Custom sound library</li>
                <li>Sleep tracking & analytics</li>
                <li>Firebase integration ready</li>
                <li>Modern dark theme UI</li>
                <li>Cross-platform (iOS & Android)</li>
            </ul>
        </div>
        <div class="right-section">
            <div class="phone-mockup">
                <div class="screen">
                    <div class="alarm-icon">⏰</div>
                    <div class="time-display">07:30</div>
                    <div class="status-text">Next alarm in 8h 45m</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Instructions for creating preview image:
        // 1. Open this file in browser
        // 2. Take screenshot of the preview container (590x300 area)
        // 3. Save as PNG or JPEG
        console.log('Preview image ready for screenshot - 590x300 pixels');
    </script>
</body>
</html>
